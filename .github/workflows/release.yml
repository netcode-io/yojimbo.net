# Release: publish the C# port to NuGet (yojimbo) and the TypeScript port to npm (yojimbo2).
#
# Push a tag v<VERSION>, where VERSION is the root VERSION file (e.g. v1.13.500 for upstream 1.13.5, v1.13.501 for a
# port-only fix on top of it; both packages publish that same version).
# tools/version.mjs checks the tag against VERSION, cs/yojimbo.csproj, ts/package.json and the upstream version
# in cpp/. Run it by hand (Actions > release > Run workflow) for a dry run that builds, tests and packs but
# publishes nothing.
#
# Secrets: NUGET_API_KEY (nuget.org API key with push rights for "yojimbo"), NPM_TOKEN (npm automation or granular
# token with publish rights for "yojimbo2").

name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet and npm (unchecked = dry run)'
        type: boolean
        default: false

permissions:
  contents: write        # create the GitHub release
  id-token: write        # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # the version check reads cpp/, interop builds it
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: check versions
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node tools/version.mjs check "${{ github.ref_name }}"
          else
            node tools/version.mjs check
          fi

      # the suites bind fixed UDP ports, so they run one after another
      - name: test (C#)
        run: |
          dotnet build cs/yojimbo.slnx -c Release
          dotnet cs/bin/test/Release/test.dll
          dotnet cs/bin/custom_packet_io_test/Release/custom_packet_io_test.dll
          dotnet cs/bin/fuzz/Release/fuzz.dll
          dotnet build cs/test.csproj -c Release -p:YojimboTargetFramework=netstandard2.1 -p:BuildRoot="$RUNNER_TEMP/ns21/"
          dotnet "$RUNNER_TEMP/ns21/bin/test/Release/test.dll"
      - name: test (TypeScript)
        working-directory: ts
        run: |
          npm ci
          npm run typecheck
          npm test
          node custom_packet_io_test.ts
          npm run test:webrtc
          npm run build
          npm run test:bundle
      - name: interop
        run: interop/run.sh

      - name: pack
        run: |
          mkdir -p artifacts
          dotnet pack cs/yojimbo.csproj -c Release -o artifacts
          (cd ts && npm pack --pack-destination ../artifacts)
          ls -l artifacts

      - name: publish to NuGet
        if: env.PUBLISH == 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: publish to npm
        if: env.PUBLISH == 'true'
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: dry run (npm)
        if: env.PUBLISH != 'true'
        working-directory: ts
        run: npm publish --dry-run

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --title "${{ github.ref_name }}" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
